        /* Marker Styles */

            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: bottom center;
            cursor: pointer;
            position: relative;
        }
        .marker-container:hover { transform: scale(1.15) translateY(-5px); z-index: 50 !important; }
        .marker-emoji {
            line-height: 1;
            filter: drop-shadow(0px 8px 6px rgba(0,0,0,0.5)) drop-shadow(0px 2px 2px rgba(0,0,0,0.3));
        }
        .marker-selected {
            transform: scale(1.25);

            filter: drop-shadow(0px 0px 12px rgba(251, 191, 36, 0.9)) drop-shadow(0px 8px 6px rgba(0,0,0,0.5));

        /* User Pulse Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .user-pulse::before {
            content: '';
            position: absolute;
            inset: -10px;
            background-color: rgba(234, 88, 12, 0.4);
            border-radius: 50%;

    <script>
        // --- SUPABASE CONFIG ---
        const SUPABASE_URL = 'https://tehvtftiwlsrasatibwp.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_BfHQCR5x4NzHqimkCJTmOQ_36TccGzw'; 

        // --- DATA ---
        // These act as offline fallbacks if your database is empty
        let PANDALS = [
            { id: "pandal-1", name: "Aneek sangha", lat: 24.9999125, lng: 88.1387031, description: "Beautiful traditional pandal in Malda." },
            { id: "pandal-2", name: "Pandal Name 2", lat: 25.0006875, lng: 88.1343125, description: "Popular local gathering spot." }
        ];

        let WASHROOMS = [
            { id: "w-1", name: "Public Restroom (Malda)", lat: 25.0002, lng: 88.1360 }
        ];

        const DEFAULT_CENTER = { lat: 25.0003, lng: 88.1365 }; // Malda center

        // Initialize Supabase Client
        let supabaseClient = null;
        if (SUPABASE_URL && SUPABASE_ANON_KEY) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // Fetch live data from Supabase database
        async function loadLiveData() {
            if (!supabaseClient) return;
            
            try {
                // Fetch Pandals
                const { data: pandalData, error: pandalError } = await supabaseClient.from('pandals').select('*');
                if (pandalError) throw pandalError;
                if (pandalData && pandalData.length > 0) PANDALS = pandalData;

                // Fetch Washrooms
                const { data: washroomData, error: washroomError } = await supabaseClient.from('washrooms').select('*');
                if (washroomError) throw washroomError;
                if (washroomData && washroomData.length > 0) WASHROOMS = washroomData;
                
                if (pandalData.length > 0 || washroomData.length > 0) {
                    showToast("Live map data synced automatically!", "info");
                }
            } catch (err) {
                console.error("Supabase fetch error:", err);
                showToast("Couldn't connect to database, using offline mode.", "error");
            }
        }

        // --- STATE ---
        let state = {
            selectedPandals: new Set(),
            searchQuery: "",
            showPandals: true,
            showWashrooms: false,
            userLocation: null,
            routeInfo: null,
            isPlanningRoute: false,
            isMobileSheetOpen: false
        };

        // --- GOOGLE MAPS OBJECTS ---
        let map, directionsService, directionsRenderer, infoWindow;
        let markers = { pandals: {}, washrooms: {}, user: null };
        let MarkerLib, CoreLib;

        // --- DOM ELEMENTS ---
        const els = {
            map: document.getElementById('map'),
            mapLoading: document.getElementById('map-loading'),
            pandalList: document.getElementById('pandal-list'),
            searchInput: document.getElementById('searchInput'),
            planRouteBtn: document.getElementById('planRouteBtn'),
            planRouteText: document.getElementById('planRouteText'),
            btnIconNav: document.getElementById('btn-icon-nav'),
            btnIconLoad: document.getElementById('btn-icon-load'),
            togglePandals: document.getElementById('togglePandals'),
            toggleWashrooms: document.getElementById('toggleWashrooms'),
            locateUser: document.getElementById('locateUser'),
            sidebar: document.getElementById('sidebar'),
            dragHandle: document.getElementById('dragHandle'),
            mobileToggleBtn: document.getElementById('mobileToggleBtn'),
            iconList: document.getElementById('icon-list'),
            iconMap: document.getElementById('icon-map'),
            listView: document.getElementById('list-view'),
            routeView: document.getElementById('route-view'),
            closeRouteBtn: document.getElementById('closeRouteBtn'),
            routeSteps: document.getElementById('route-steps'),
            routeDuration: document.getElementById('routeDuration'),
            routeDistance: document.getElementById('routeDistance'),
            toastContainer: document.getElementById('toast-container'),
        };

        // --- UTILITIES ---
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const colors = type === 'error' ? 'bg-red-100 text-red-800 border-red-200' : 'bg-white text-gray-800 border-gray-200 shadow-xl';
            toast.className = `px-6 py-3 rounded-xl border font-medium text-sm transition-all duration-300 transform translate-y-[-100%] opacity-0 flex items-center gap-3 z-50 ${colors}`;
            toast.innerHTML = type === 'error' ? `<span>⚠️</span> ${message}` : `<span>ℹ️</span> ${message}`;
            
            els.toastContainer.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.style.transform = 'translateY(0)';
                toast.style.opacity = '1';
            });

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function calcDist(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // --- MAPS INIT & MARKERS ---
        async function initMap() {
            try {
                await loadLiveData();

                CoreLib = await google.maps.importLibrary("maps");
                MarkerLib = await google.maps.importLibrary("marker");
                const RoutesLib = await google.maps.importLibrary("routes");

                map = new CoreLib.Map(els.map, {
                    center: DEFAULT_CENTER,
                    zoom: 12.5,
                    mapId: "DEMO_MAP_ID",
                    disableDefaultUI: true,
                    gestureHandling: "greedy",
                    styles: [
                        { featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] },
                        { featureType: "transit", elementType: "labels", stylers: [{ visibility: "off" }] }
                    ]
                });

                directionsService = new RoutesLib.DirectionsService();
                directionsRenderer = new RoutesLib.DirectionsRenderer({
                    map: map,
                    suppressMarkers: true,
                    polylineOptions: {
                        strokeColor: '#EA580C',
                        strokeOpacity: 0.8,
                        strokeWeight: 6,
                    }
                });

                infoWindow = new CoreLib.InfoWindow({ minWidth: 220 });

                els.mapLoading.style.opacity = '0';
                setTimeout(() => els.mapLoading.style.display = 'none', 500);

                updateMarkers();
                renderPandalList();
                
                setTimeout(requestLocation, 1500);

            } catch (error) {
                console.error("Map Load Error", error);
                showToast("Failed to load Google Maps. Please check your network.", "error");
            }
        }

        function createCustomMarkerDOM(emoji, size = '40px') {
            const div = document.createElement('div');
            div.className = 'marker-container';
            div.innerHTML = `<div class="marker-emoji" style="font-size: ${size};">${emoji}</div>`;
            return div;
        }

        function createUserMarkerDOM() {
            const div = document.createElement('div');
            div.className = 'marker-container user-pulse z-50';
            div.innerHTML = `<div class="bg-white rounded-full p-1.5 shadow-xl border-2 border-puja-route"><div class="marker-emoji" style="font-size: 26px;">🧍</div></div>`;
            return div;
        }

        function updateMarkers() {
            if (!map || !MarkerLib) return;

            // PANDALS
            PANDALS.forEach(pandal => {
                if (!markers.pandals[pandal.id]) {
                    const dom = createCustomMarkerDOM('🪷', '46px');
                    const marker = new MarkerLib.AdvancedMarkerElement({
                        map: state.showPandals ? map : null,
                        position: { lat: pandal.lat, lng: pandal.lng },
                        content: dom,
                        title: pandal.name,
                    });

                    dom.addEventListener('click', () => {
                        const isSel = state.selectedPandals.has(pandal.id);
                        infoWindow.setContent(`
                            <div style="padding: 10px; font-family: 'Inter', sans-serif; text-align: center; max-width: 220px;">
                                <h3 style="margin:0 0 6px 0; color: #B91C1C; font-weight: 700; font-size: 16px;">${pandal.name}</h3>
                                <p style="margin:0 0 12px 0; font-size: 13px; color: #555; line-height: 1.4;">${pandal.description || ''}</p>
                                <button id="iw-btn-${pandal.id}" style="background: ${isSel ? '#f3f4f6' : '#B91C1C'}; color: ${isSel ? '#374151' : '#fff'}; border: ${isSel ? '1px solid #d1d5db' : 'none'}; padding: 8px 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; font-size: 14px; transition: all 0.2s;">
                                    ${isSel ? 'Remove from Route' : 'Add to Route'}
                                </button>
                            </div>
                        `);
                        infoWindow.open(map, marker);
                        
                        setTimeout(() => {
                            const btn = document.getElementById(`iw-btn-${pandal.id}`);
                            if (btn) btn.addEventListener('click', () => {
                                togglePandal(pandal.id);
                                infoWindow.close();
                            });
                        }, 50);
                    });
                    markers.pandals[pandal.id] = { marker, dom };
                } else {
                    markers.pandals[pandal.id].marker.map = state.showPandals ? map : null;
                    if (state.selectedPandals.has(pandal.id)) {
                        markers.pandals[pandal.id].dom.classList.add('marker-selected');
                    } else {
                        markers.pandals[pandal.id].dom.classList.remove('marker-selected');
                    }
                }
            });

            // WASHROOMS
            WASHROOMS.forEach(w => {
                if (!markers.washrooms[w.id]) {
                    const dom = createCustomMarkerDOM('🚽', '34px');
                    const marker = new MarkerLib.AdvancedMarkerElement({
                        map: state.showWashrooms ? map : null,
                        position: { lat: w.lat, lng: w.lng },
                        content: dom,
                        title: w.name,
                    });
                    dom.addEventListener('click', () => {
                        infoWindow.setContent(`<div style="padding:8px;font-weight:600;color:#1e40af;font-family:'Inter',sans-serif;">🚽 ${w.name}</div>`);
                        infoWindow.open(map, marker);
                    });
                    markers.washrooms[w.id] = { marker, dom };
                } else {
                    markers.washrooms[w.id].marker.map = state.showWashrooms ? map : null;
                }
            });

            // USER
            if (state.userLocation) {
                if (!markers.user) {
                    markers.user = new MarkerLib.AdvancedMarkerElement({
                        map: map,
                        position: state.userLocation,
                        content: createUserMarkerDOM(),
                        title: "Your Location",
                        zIndex: 999
                    });
                } else {
                    markers.user.position = state.userLocation;
                }
            }
        }

        function requestLocation() {
            if (!navigator.geolocation) {
                showToast("Geolocation is not supported by your browser.", "error");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    state.userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    updateMarkers();
                    if(map) {
                        map.panTo(state.userLocation);
                        map.setZoom(14);
                    }
                },
                (err) => {
                    showToast("Location access denied. Please enable it for routing from your current spot.", "info");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function togglePandal(id) {
            if (state.selectedPandals.has(id)) {
                state.selectedPandals.delete(id);
            } else {
                state.selectedPandals.add(id);
                const p = PANDALS.find(x => x.id === id);
                if (p && map && window.innerWidth > 768) {
                    map.panTo({lat: p.lat, lng: p.lng});
                }
            }
            updateMarkers();
            renderPandalList();
            updateBottomButton();
        }

        function optimizeRouteOrder(startLoc, pandalDataList) {
            let unvisited = [...pandalDataList];
            let curr = startLoc;
            let ordered = [];
            while(unvisited.length > 0) {
                let nearestIdx = 0, minDist = Infinity;
                for(let i=0; i<unvisited.length; i++) {
                    const d = calcDist(curr.lat, curr.lng, unvisited[i].lat, unvisited[i].lng);
                    if(d < minDist) { minDist = d; nearestIdx = i; }
                }
                const next = unvisited.splice(nearestIdx, 1)[0];
                ordered.push(next);
                curr = { lat: next.lat, lng: next.lng };
            }
            return ordered;
        }

        async function planRoute() {
            if (!state.userLocation) {
                showToast("Please allow location access to plan a route from your spot.", "error");
                requestLocation();
                return;
            }
            if (state.selectedPandals.size === 0) return;

            setLoadingState(true);

            const selectedData = PANDALS.filter(p => state.selectedPandals.has(p.id));
            const optimized = optimizeRouteOrder(state.userLocation, selectedData);

            const waypoints = optimized.slice(0, -1).map(p => ({
                location: new CoreLib.LatLng(p.lat, p.lng),
                stopover: true
            }));
            const dest = optimized[optimized.length - 1];

            try {
                const res = await new Promise((resolve, reject) => {
                    directionsService.route({
                        origin: new CoreLib.LatLng(state.userLocation.lat, state.userLocation.lng),
                        destination: new CoreLib.LatLng(dest.lat, dest.lng),
                        waypoints: waypoints,
                        optimizeWaypoints: false,
                        travelMode: google.maps.TravelMode.DRIVING,
                    }, (result, status) => {
                        if (status === 'OK') resolve(result);
                        else reject(status);
                    });
                });

                directionsRenderer.setDirections(res);
                
                let dist = 0, time = 0;
                res.routes[0].legs.forEach(l => { dist += l.distance.value; time += l.duration.value; });

                state.routeInfo = {
                    sequence: optimized,
                    distance: (dist/1000).toFixed(1) + ' km',
                    duration: Math.round(time/60) + ' mins',
                    legs: res.routes[0].legs
                };

                renderRouteSummary();
                showRouteView();
                
                if(window.innerWidth < 768) toggleMobileSheet(false);

            } catch (err) {
                console.error(err);
                showToast("Could not calculate road route. Check your connection.", "error");
            } finally {
                setLoadingState(false);
            }
        }

        function clearRoute() {
            if (directionsRenderer) directionsRenderer.setDirections({routes: []});
            state.routeInfo = null;
            state.selectedPandals.clear();
            updateMarkers();
            renderPandalList();
            updateBottomButton();
            showListView();
            if(map && state.userLocation) {
                map.panTo(state.userLocation);
                map.setZoom(13);
            }
        }

        function renderPandalList() {
            const q = state.searchQuery.toLowerCase();
            const filtered = PANDALS.filter(p => p.name.toLowerCase().includes(q));
            
            if (filtered.length === 0) {
                els.pandalList.innerHTML = `<div class="text-center text-gray-400 py-10">No pandals found matching "${q}".</div>`;
                return;
            }

            els.pandalList.innerHTML = filtered.map(p => {
                const isSel = state.selectedPandals.has(p.id);
                return `
                    <div onclick="togglePandal('${p.id}')" class="cursor-pointer p-4 rounded-2xl border-2 transition-all duration-300 flex items-center gap-4 ${isSel ? 'border-puja-gold bg-amber-50/50 shadow-[0_4px_15px_rgba(251,191,36,0.15)] scale-[1.01]' : 'border-transparent bg-white shadow-sm hover:shadow-md hover:bg-gray-50'}">
                        <div class="text-3xl drop-shadow-sm filter transition-transform ${isSel ? 'scale-110' : ''}">🪷</div>
                        <div class="flex-1">
                            <h3 class="font-bold text-base ${isSel ? 'text-puja-red' : 'text-gray-800'}">${p.name}</h3>
                            <p class="text-xs text-gray-500 line-clamp-1 mt-0.5">${p.description || ''}</p>
                        </div>
                        <div class="w-7 h-7 rounded-full flex items-center justify-center border-2 transition-all duration-300 ${isSel ? 'bg-puja-red border-puja-red text-white shadow-md' : 'border-gray-300 text-transparent'}">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderRouteSummary() {
            if(!state.routeInfo) return;
            
            els.routeDuration.textContent = state.routeInfo.duration;
            els.routeDistance.textContent = `(${state.routeInfo.distance})`;

            let html = `
                <div class="absolute left-[23px] top-8 bottom-8 w-1 bg-gradient-to-b from-puja-red via-puja-route to-puja-gold opacity-30 rounded-full z-0"></div>
                
                <div class="flex items-center gap-4 relative z-10 py-4">
                    <div class="w-12 h-12 rounded-full bg-blue-100 border-4 border-white shadow-md flex items-center justify-center text-blue-700 text-xl z-10 relative">🧍</div>
                    <div class="font-bold text-gray-800 text-lg">Your Location</div>
                </div>
            `;

            state.routeInfo.sequence.forEach((p, idx) => {
                const leg = state.routeInfo.legs[idx];
                html += `
                    <div class="flex items-start gap-4 relative z-10 py-3">
                        <div class="w-12 h-12 rounded-full bg-white border-4 border-puja-red flex items-center justify-center shadow-md font-bold text-puja-red text-lg z-10 relative">
                            ${idx + 1}
                        </div>
                        <div class="flex-1 bg-white p-4 rounded-2xl shadow-sm border border-gray-100 group hover:shadow-md transition-shadow">
                            <div class="font-bold text-gray-800 text-base mb-1">${p.name}</div>
                            ${leg ? `
                            <div class="text-sm text-gray-500 flex gap-3 font-medium bg-gray-50 p-2 rounded-lg inline-flex">
                                <span>🚗 ${leg.duration.text}</span>
                                <span class="text-gray-300">|</span>
                                <span>${leg.distance.text}</span>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });

            html += `
                <div class="mt-6 pt-4 border-t border-gray-100">
                    <button onclick="clearRoute()" class="w-full py-4 bg-gray-100 hover:bg-red-50 text-gray-600 hover:text-red-600 font-bold rounded-2xl transition-colors border border-gray-200">
                        Clear Route & Start Over
                    </button>
                </div>
            `;
            els.routeSteps.innerHTML = html;
        }

        function updateBottomButton() {
            const count = state.selectedPandals.size;
            if (count > 0) {
                els.planRouteBtn.disabled = false;
                els.planRouteBtn.className = "w-full py-4 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-xl transition-all transform hover:-translate-y-1 bg-gradient-to-r from-puja-red to-puja-darkRed text-white hover:shadow-2xl";
                els.planRouteText.textContent = `Plan Route (${count} stops)`;
                els.btnIconNav.classList.remove('hidden');
            } else {
                els.planRouteBtn.disabled = true;
                els.planRouteBtn.className = "w-full py-4 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-sm transition-all bg-gray-100 text-gray-400 cursor-not-allowed";
                els.planRouteText.textContent = "Select Pandals to Plan";
                els.btnIconNav.classList.remove('hidden');
            }
        }

        function setLoadingState(isLoading) {
            state.isPlanningRoute = isLoading;
            if(isLoading) {
                els.planRouteBtn.disabled = true;
                els.planRouteBtn.classList.add('opacity-80');
                els.btnIconNav.classList.add('hidden');
                els.btnIconLoad.classList.remove('hidden');
                els.planRouteText.textContent = "Generating Route...";
            } else {
                updateBottomButton();
                els.btnIconLoad.classList.add('hidden');
            }
        }

        function showRouteView() {
            els.listView.classList.add('hidden');
            els.routeView.classList.remove('hidden');
            els.routeView.classList.add('flex');
        }

        function showListView() {
            els.routeView.classList.add('hidden');
            els.routeView.classList.remove('flex');
            els.listView.classList.remove('hidden');
        }

        function toggleMobileSheet(forceState) {
            const willOpen = forceState !== undefined ? forceState : !state.isMobileSheetOpen;
            state.isMobileSheetOpen = willOpen;
            if (willOpen) {
                els.sidebar.classList.remove('translate-y-[calc(100%-48px)]');
                els.sidebar.classList.add('translate-y-0');
                els.iconList.classList.add('hidden');
                els.iconMap.classList.remove('hidden');
            } else {
                els.sidebar.classList.add('translate-y-[calc(100%-48px)]');
                els.sidebar.classList.remove('translate-y-0');
                els.iconMap.classList.add('hidden');
                els.iconList.classList.remove('hidden');
            }
        }

        // EVENT LISTENERS
        els.searchInput.addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            renderPandalList();
        });

        els.togglePandals.addEventListener('click', () => {
            state.showPandals = !state.showPandals;
            const eye = document.getElementById('eye-off-pandals');
            if(state.showPandals) {
                els.togglePandals.classList.add('bg-red-50/80', 'text-red-600');
                els.togglePandals.classList.remove('text-gray-400', 'hover:bg-gray-50/80');
                eye.classList.add('hidden');
            } else {
                els.togglePandals.classList.remove('bg-red-50/80', 'text-red-600');
                els.togglePandals.classList.add('text-gray-400', 'hover:bg-gray-50/80');
                eye.classList.remove('hidden');
            }
            updateMarkers();
        });

        els.toggleWashrooms.addEventListener('click', () => {
            state.showWashrooms = !state.showWashrooms;
            const eye = document.getElementById('eye-off-washrooms');
            const icon = document.getElementById('washroom-icon');
            if(state.showWashrooms) {
                els.toggleWashrooms.classList.add('bg-blue-50/80', 'text-blue-600');
                els.toggleWashrooms.classList.remove('text-gray-400', 'hover:bg-gray-50/80');
                icon.classList.remove('grayscale', 'opacity-50');
                eye.classList.add('hidden');
            } else {
                els.toggleWashrooms.classList.remove('bg-blue-50/80', 'text-blue-600');
                els.toggleWashrooms.classList.add('text-gray-400', 'hover:bg-gray-50/80');
                icon.classList.add('grayscale', 'opacity-50');
                eye.classList.remove('hidden');
            }
            updateMarkers();
        });

        els.locateUser.addEventListener('click', requestLocation);
        els.planRouteBtn.addEventListener('click', planRoute);
        els.closeRouteBtn.addEventListener('click', showListView);
        
        // Mobile Interactions
        els.mobileToggleBtn.addEventListener('click', () => toggleMobileSheet());
        els.dragHandle.addEventListener('click', () => toggleMobileSheet());
        
        let touchStartY = 0;
        els.dragHandle.addEventListener('touchstart', e => touchStartY = e.changedTouches[0].screenY, {passive: true});
        els.dragHandle.addEventListener('touchend', e => {
            if (e.changedTouches[0].screenY > touchStartY + 30) toggleMobileSheet(false);
            if (e.changedTouches[0].screenY < touchStartY - 30) toggleMobileSheet(true);
        }, {passive: true});

        // Initialize Map
        window.addEventListener('load', initMap);

    </script>
</body>
</html>
