    <script>

            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],

                    colors: {

                            gold: '#FBBF24',
                            darkGold: '#B45309',

                            route: '#EA580C',
                            surface: '#FFFFFF'

                    boxShadow: {
                        'sheet': '0 -8px 30px rgba(0, 0, 0, 0.18)',

    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        /* Prevent unwanted rubber-band scrolling on whole body */
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background-color: #FFFBEB;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Safe area utility helpers */
        .safe-top { padding-top: var(--sat); }
        .safe-bottom { padding-bottom: max(var(--sab), 12px); }
        
        /* Map container takes full dynamic height */
        .app-viewport {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Marker Styles */
        .marker-container {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: bottom center;
            cursor: pointer;
            position: relative;
        }
        .marker-container:active {
            transform: scale(1.2) translateY(-4px);
        }
        .marker-emoji {
            line-height: 1;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35));
        }
        .marker-selected {
            transform: scale(1.22);
            z-index: 50 !important;
        }
        .marker-selected .marker-emoji {
            filter: drop-shadow(0 0 10px #FBBF24) drop-shadow(0 6px 8px rgba(0,0,0,0.4));
        }
        
        /* Ripple animation for user GPS */
        @keyframes pulse-ring {
            0% { transform: scale(0.7); opacity: 1; }
            100% { transform: scale(2.4); opacity: 0; }
        }
        .user-pulse::before {
            content: '';
            position: absolute;
            inset: -8px;
            background-color: rgba(234, 88, 12, 0.45);
            border-radius: 50%;
            animation: pulse-ring 2s infinite cubic-bezier(0.2, 0.6, 0.35, 1);
            z-index: -1;
        }

        /* Smooth momentum scrolling for list */
        .smooth-scroll {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        /* Bottom sheet styling */
        .mobile-sheet {
            will-change: transform;
            touch-action: none; /* Drag handle takes full control */
        }
        
        .sheet-transition {
            transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Custom subtle scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 9999px; }
    </style>
</head>

                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch(e) {
                console.warn("Supabase init bypassed:", e);
            }

        // Global State
        const state = {
            selectedPandals: new Set(),
            searchQuery: "",
            filterMode: "all", // "all" | "selected"
            showPandals: true,
            showWashrooms: false,
            userLocation: null,
            routeInfo: null,
            isPlanningRoute: false,
            // Mobile Sheet Snap States: 'collapsed' (peek), 'half' (midway), 'expanded' (full)
            sheetState: 'half',
            sheetHeights: {
                collapsed: 72, // px peek
                half: 0.48,     // 48% screen height
                expanded: 0.88  // 88% screen height
            }
        };

        // Google Maps Instances
        let map, directionsService, directionsRenderer, infoWindow;
        let markers = { pandals: {}, washrooms: {}, user: null };
        let MarkerLib, CoreLib;

        // Light haptic feedback helper for smartphones
        function triggerHaptic(duration = 10) {
            if ('vibrate' in navigator) {
                try { navigator.vibrate(duration); } catch (e) {}
            }
        }

        // Custom mobile toast
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'error' 
                ? 'bg-red-900/90 text-white border-red-700' 
                : 'bg-gray-900/90 text-white border-amber-500/40';
            
            toast.className = `px-4 py-2.5 rounded-2xl border shadow-xl backdrop-blur-md font-medium text-xs flex items-center gap-2 transform transition-all duration-300 translate-y-[-8px] opacity-0 pointer-events-auto ${bgClass}`;
            toast.innerHTML = `<span>${type === 'error' ? '⚠️' : '🪷'}</span><span>${message}</span>`;
            
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-[-8px]', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        // Haversine formula for distance calculation in KM
        function calcDist(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + 
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        const bottomSheet = document.getElementById('bottomSheet');
        const dragHeader = document.getElementById('dragHeader');
        let startTouchY = 0;
        let currentTranslateY = 0;
        let isDragging = false;
        let windowHeight = window.innerHeight;

        function getSheetY(stateName) {
            windowHeight = window.innerHeight;
            if (window.innerWidth >= 768) return 0; // Desktop sidebar mode
            if (stateName === 'collapsed') {
                return windowHeight - state.sheetHeights.collapsed;
            }
            if (stateName === 'half') {
                return windowHeight * (1 - state.sheetHeights.half);
            }
            if (stateName === 'expanded') {
                return windowHeight * (1 - state.sheetHeights.expanded);
            }
            return 0;
        }

        function setSheetState(newState, animate = true) {
            if (window.innerWidth >= 768) {
                bottomSheet.style.transform = 'none';
                return;
            }
            state.sheetState = newState;
            if (animate) bottomSheet.classList.add('sheet-transition');
            else bottomSheet.classList.remove('sheet-transition');

            const targetY = getSheetY(newState);
            bottomSheet.style.transform = `translateY(${targetY}px)`;

            // Update Header Icon & Label
            const headerIconList = document.getElementById('headerIconList');
            const headerIconMap = document.getElementById('headerIconMap');
            const stateLabel = document.getElementById('sheetStateLabel');
            
            if (newState === 'expanded') {
                headerIconList.classList.add('hidden');
                headerIconMap.classList.remove('hidden');
                stateLabel.textContent = 'Swipe down';
            } else {
                headerIconList.classList.remove('hidden');
                headerIconMap.classList.add('hidden');
                stateLabel.textContent = newState === 'collapsed' ? 'Swipe up' : 'Details';
            }

            // Show or hide floating quick plan pill when sheet is peeked
            updateQuickPlanPill();
            triggerHaptic(8);
        }

        // Touch event handlers for smooth 60fps drag
        dragHeader.addEventListener('touchstart', (e) => {
            if (window.innerWidth >= 768) return;
            isDragging = true;
            startTouchY = e.touches[0].clientY;
            bottomSheet.classList.remove('sheet-transition');
            
            // Get current computed translateY
            const style = window.getComputedStyle(bottomSheet);
            const matrix = new WebKitCSSMatrix(style.transform);
            currentTranslateY = matrix.m41 || matrix.f || getSheetY(state.sheetState);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const touchY = e.touches[0].clientY;
            const deltaY = touchY - startTouchY;
            let newY = currentTranslateY + deltaY;

            // Restrict bounds (prevent dragging off-screen top or completely below screen)
            const minY = getSheetY('expanded');
            const maxY = getSheetY('collapsed');
            if (newY < minY - 30) newY = minY - (minY - newY) * 0.2; // Rubber-band effect
            if (newY > maxY + 30) newY = maxY + (newY - maxY) * 0.2;

            bottomSheet.style.transform = `translateY(${newY}px)`;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            bottomSheet.classList.add('sheet-transition');

            const style = window.getComputedStyle(bottomSheet);
            const matrix = new WebKitCSSMatrix(style.transform);
            const finalY = matrix.m41 || matrix.f;

            const yExpanded = getSheetY('expanded');
            const yHalf = getSheetY('half');
            const yCollapsed = getSheetY('collapsed');

            // Find closest snap target
            const distExpanded = Math.abs(finalY - yExpanded);
            const distHalf = Math.abs(finalY - yHalf);
            const distCollapsed = Math.abs(finalY - yCollapsed);

            const minDist = Math.min(distExpanded, distHalf, distCollapsed);

            if (minDist === distExpanded) setSheetState('expanded');
            else if (minDist === distHalf) setSheetState('half');
            else setSheetState('collapsed');
        }, { passive: true });

        // Header buttons toggle
        document.getElementById('headerSheetToggle').addEventListener('click', () => {
            if (state.sheetState === 'expanded') {
                setSheetState('collapsed');
            } else {
                setSheetState('expanded');
            }
        });

        dragHeader.addEventListener('click', () => {
            if (state.sheetState === 'collapsed') setSheetState('half');
            else if (state.sheetState === 'half') setSheetState('expanded');
            else setSheetState('collapsed');
        });

        // Window resize adjustment
        window.addEventListener('resize', () => {
            windowHeight = window.innerHeight;
            setSheetState(state.sheetState, false);
        });

        async function syncRemoteData() {
            if (!supabaseClient) return;
            try {
                const { data: pandalData, error: pandalError } = await supabaseClient.from('pandals').select('*');
                if (!pandalError && pandalData && pandalData.length > 0) {
                    PANDALS = pandalData;
                }

                const { data: washroomData, error: washError } = await supabaseClient.from('washrooms').select('*');
                if (!washError && washroomData && washroomData.length > 0) {
                    WASHROOMS = washroomData;
                }
            } catch (err) {
                console.warn("Supabase fetch fallback:", err);
            }
        }

        async function initAppMap() {
            try {
                await syncRemoteData();

                CoreLib = await google.maps.importLibrary("maps");
                MarkerLib = await google.maps.importLibrary("marker");
                const RoutesLib = await google.maps.importLibrary("routes");

                map = new CoreLib.Map(document.getElementById('map'), {
                    center: DEFAULT_CENTER,
                    zoom: 13.5,
                    mapId: "DEMO_MAP_ID",
                    disableDefaultUI: true,
                    gestureHandling: "greedy",
                    zoomControl: false,
                    styles: [
                        { featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] },
                        { featureType: "transit", elementType: "labels", stylers: [{ visibility: "off" }] }
                    ]
                });

                directionsService = new RoutesLib.DirectionsService();
                directionsRenderer = new RoutesLib.DirectionsRenderer({
                    map: map,
                    suppressMarkers: true,
                    polylineOptions: {
                        strokeColor: '#B91C1C',
                        strokeOpacity: 0.9,
                        strokeWeight: 6,
                    }
                });

                infoWindow = new CoreLib.InfoWindow({ minWidth: 200 });

                // Hide loading screen
                const loader = document.getElementById('map-loading');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);

                // Initial UI setups
                updateMarkers();
                renderPandalList();
                setSheetState('half');

                // Auto request location with courteous delay
                setTimeout(requestUserLocation, 800);

            } catch (error) {
                console.error("Map initialization failed", error);
                showToast("Maps offline mode active.", "error");
                document.getElementById('map-loading').style.display = 'none';
                renderPandalList();
                setSheetState('half');
            }
        }

        function updateMarkers() {
            if (!map || !MarkerLib) return;

            // 1. PANDALS
            PANDALS.forEach(pandal => {
                if (!markers.pandals[pandal.id]) {
                    const dom = createCustomMarkerDOM('🪷', '42px', true);
                    const marker = new MarkerLib.AdvancedMarkerElement({
                        map: state.showPandals ? map : null,
                        position: { lat: pandal.lat, lng: pandal.lng },
                        content: dom,
                        title: pandal.name,
                    });

                    dom.addEventListener('click', (e) => {
                        e.stopPropagation();
                        triggerHaptic(15);
                        const isSel = state.selectedPandals.has(pandal.id);
                        
                        infoWindow.setContent(`
                            <div style="padding: 10px; font-family: 'Inter', sans-serif; text-align: center; max-width: 200px;">
                                <h3 style="margin:0 0 4px 0; color: #B91C1C; font-weight: 700; font-size: 15px;">${pandal.name}</h3>
                                <p style="margin:0 0 10px 0; font-size: 11px; color: #64748b; line-height: 1.3;">${pandal.description || 'Festive Durga Puja Pandal'}</p>
                                <button id="iw-btn-${pandal.id}" style="background: ${isSel ? '#FEF2F2' : '#B91C1C'}; color: ${isSel ? '#B91C1C' : '#FFFFFF'}; border: 1.5px solid #B91C1C; padding: 7px 12px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: 700; font-size: 12px; transition: all 0.2s;">
                                    ${isSel ? '✓ Selected (Remove)' : '+ Add to Circuit'}
                                </button>
                            </div>
                        `);
                        infoWindow.open(map, marker);

                        setTimeout(() => {
                            const btn = document.getElementById(`iw-btn-${pandal.id}`);
                            if (btn) btn.addEventListener('click', () => {
                                togglePandalSelection(pandal.id);
                                infoWindow.close();
                            });

                    });

                    markers.pandals[pandal.id] = { marker, dom };
                } else {
                    markers.pandals[pandal.id].marker.map = state.showPandals ? map : null;
                    if (state.selectedPandals.has(pandal.id)) {
                        markers.pandals[pandal.id].dom.classList.add('marker-selected');

                        markers.pandals[pandal.id].dom.classList.remove('marker-selected');

        function requestUserLocation() {
            if (!navigator.geolocation) {
                showToast("Location not supported by device", "error");

            const gpsLabel = document.getElementById('gpsLabel');
            gpsLabel.textContent = "Locating...";

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    state.userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    gpsLabel.textContent = "My Spot";
                    updateMarkers();
                    renderPandalList(); // recalculates distances
                    if (map) {
                        map.panTo(state.userLocation);
                        map.setZoom(14.5);
                    }
                    showToast("GPS position acquired!");
                    triggerHaptic(15);
                },
                (err) => {
                    gpsLabel.textContent = "Locate";
                    console.warn("Geolocation warning:", err.message);
                    showToast("Location permission optional. Using city center.", "info");
                },
                { enableHighAccuracy: true, timeout: 9000, maximumAge: 10000 }
            );
        }

        function renderPandalList() {
            const listEl = document.getElementById('pandalListContainer');
            const query = state.searchQuery.trim().toLowerCase();

            let list = [...PANDALS];

            // Search filter
            if (query) {
                list = list.filter(p => p.name.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query)));
            }

            // Filter Selected only
            if (state.filterMode === 'selected') {
                list = list.filter(p => state.selectedPandals.has(p.id));
            }

            // Distance attachment
            list = list.map(p => {
                let distNum = null;
                let distText = '';
                if (state.userLocation) {
                    distNum = calcDist(state.userLocation.lat, state.userLocation.lng, p.lat, p.lng);
                    distText = distNum < 1 ? `${Math.round(distNum * 1000)} m away` : `${distNum.toFixed(1)} km away`;
                }
                return { ...p, distNum, distText };
            });

                            <svg class="w-4 h-4 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                        </div>

        function computeSpatialTSP(startPoint, places) {
            let pool = [...places];
            let current = startPoint;
            let ordered = [];
            while (pool.length > 0) {
                let nearestIdx = 0;
                let minDist = Infinity;
                for (let i = 0; i < pool.length; i++) {
                    const d = calcDist(current.lat, current.lng, pool[i].lat, pool[i].lng);
                    if (d < minDist) {
                        minDist = d;
                        nearestIdx = i;
                    }
                }
                const chosen = pool.splice(nearestIdx, 1)[0];
                ordered.push(chosen);
                current = { lat: chosen.lat, lng: chosen.lng };
            }
            return ordered;
        }

        async function executeRoutePlanning() {
            if (state.selectedPandals.size === 0) return;

            // Location check
            if (!state.userLocation) {
                showToast("Acquiring GPS location to start...", "info");
                requestUserLocation();
                return;
            }

            const planBtn = document.getElementById('planRouteBtn');
            const navIcon = document.getElementById('btn-icon-nav');
            const loadIcon = document.getElementById('btn-icon-load');
            const planTxt = document.getElementById('planRouteText');

            planBtn.disabled = true;
            navIcon.classList.add('hidden');
            loadIcon.classList.remove('hidden');
            planTxt.textContent = "Calculating Optimal Circuit...";

            const selectedData = PANDALS.filter(p => state.selectedPandals.has(p.id));
            const optimizedSequence = computeSpatialTSP(state.userLocation, selectedData);

            const waypoints = optimizedSequence.slice(0, -1).map(p => ({
                location: { lat: p.lat, lng: p.lng },
                stopover: true
            }));
            const destination = optimizedSequence[optimizedSequence.length - 1];

            try {
                const req = {
                    origin: state.userLocation,
                    destination: { lat: destination.lat, lng: destination.lng },
                    waypoints: waypoints,
                    optimizeWaypoints: false,
                    travelMode: google.maps.TravelMode.DRIVING
                };

                let res;
                try {
                    res = await new Promise((resolve, reject) => {
                        directionsService.route(req, (result, status) => {
                            if (status === 'OK') resolve(result);
                            else reject(status);
                        });
                    });
                } catch (driveErr) {
                    // Fallback to walking directions if driving road isn't available
                    req.travelMode = google.maps.TravelMode.WALKING;
                    res = await new Promise((resolve, reject) => {
                        directionsService.route(req, (result, status) => {
                            if (status === 'OK') resolve(result);
                            else reject(status);
                        });
                    });
                }

                directionsRenderer.setDirections(res);

                let totalDistanceMeters = 0;
                let totalDurationSeconds = 0;
                res.routes[0].legs.forEach(leg => {
                    totalDistanceMeters += leg.distance.value;
                    totalDurationSeconds += leg.duration.value;
                });

                state.routeInfo = {
                    sequence: optimizedSequence,
                    distance: (totalDistanceMeters / 1000).toFixed(1) + ' km',
                    duration: Math.round(totalDurationSeconds / 60) + ' mins',
                    legs: res.routes[0].legs
                };

                renderRouteStepsView();
                switchToRouteView();
                document.getElementById('floatingClearRoute').classList.remove('hidden');
                document.getElementById('floatingClearRoute').classList.add('flex');

                // On mobile, snap sheet to half or collapsed so the planned path is visible on map
                if (window.innerWidth < 768) {
                    setSheetState('collapsed');
                }
                showToast("Route generated successfully!");
                triggerHaptic(20);

            } catch (err) {
                console.error("Routing error:", err);
                showToast("Direct itinerary mode activated", "info");

                // Direct Geodesic Line Fallback
                const path = [state.userLocation, ...optimizedSequence.map(p => ({ lat: p.lat, lng: p.lng }))];
                if (window.fallbackPolyline) window.fallbackPolyline.setMap(null);
                window.fallbackPolyline = new CoreLib.Polyline({
                    path: path,
                    geodesic: true,
                    strokeColor: '#B91C1C',
                    strokeOpacity: 0.8,
                    strokeWeight: 5,
                    map: map
                });

                let totalDist = 0;
                for (let i = 0; i < path.length - 1; i++) {
                    totalDist += calcDist(path[i].lat, path[i].lng, path[i+1].lat, path[i+1].lng);
                }

                state.routeInfo = {
                    sequence: optimizedSequence,
                    distance: totalDist.toFixed(1) + ' km (Direct)',
                    duration: Math.round(totalDist * 10) + ' mins',
                    legs: optimizedSequence.map(() => null)
                };

                renderRouteStepsView();
                switchToRouteView();
                if (window.innerWidth < 768) setSheetState('collapsed');
            } finally {
                navIcon.classList.remove('hidden');
                loadIcon.classList.add('hidden');
                updateControlsState();
            }
        }

        function renderRouteStepsView() {
            if (!state.routeInfo) return;

            document.getElementById('routeDuration').textContent = state.routeInfo.duration;
            document.getElementById('routeDistance').textContent = `(${state.routeInfo.distance})`;

            const container = document.getElementById('routeStepsContainer');
            let html = `
                <!-- Starting Point Card -->
                <div class="flex items-center gap-3 p-3 rounded-2xl bg-blue-50/70 border border-blue-100">
                    <div class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold text-xs flex items-center justify-center flex-shrink-0">
                        GPS
                    </div>
                    <div>
                        <div class="text-xs font-bold text-gray-800">Your Current Position</div>
                        <div class="text-[11px] text-blue-600 font-medium">Starting Point</div>
                    </div>
                </div>
            `;

            state.routeInfo.sequence.forEach((p, idx) => {
                const leg = state.routeInfo.legs[idx];
                html += `
                    <div class="flex items-start gap-3 p-3 rounded-2xl bg-white border border-gray-100 shadow-sm relative">
                        <div class="w-8 h-8 rounded-full bg-puja-red text-white font-bold text-xs flex items-center justify-center flex-shrink-0 shadow-sm">
                            ${idx + 1}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-sm text-gray-900 truncate">${p.name}</h4>
                            <p class="text-xs text-gray-500 line-clamp-1 mt-0.5">${p.description || ''}</p>
                            ${leg ? `
                                <div class="mt-1 inline-flex items-center gap-2 bg-gray-50 px-2 py-0.5 rounded-md text-[11px] text-gray-600 font-medium">
                                    <span>🚗 ${leg.duration.text}</span>
                                    <span>•</span>
                                    <span>${leg.distance.text}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function switchToRouteView() {
            document.getElementById('pandalListView').classList.add('hidden');
            document.getElementById('routeSummaryView').classList.remove('hidden');
            document.getElementById('routeSummaryView').classList.add('flex');
        }

        function switchToListVIew() {
            document.getElementById('routeSummaryView').classList.add('hidden');
            document.getElementById('routeSummaryView').classList.remove('flex');
            document.getElementById('pandalListView').classList.remove('hidden');
        }

        function clearAllRoutes() {
            if (directionsRenderer) directionsRenderer.setDirections({ routes: [] });
            if (window.fallbackPolyline) window.fallbackPolyline.setMap(null);
            state.routeInfo = null;
            state.selectedPandals.clear();
            document.getElementById('floatingClearRoute').classList.add('hidden');
            document.getElementById('floatingClearRoute').classList.remove('flex');

            updateMarkers();
            renderPandalList();
            updateControlsState();
            switchToListVIew();
            showToast("Route cleared");
            triggerHaptic(10);
        }

        // Live Google Maps Navigation redirect with waypoints
        window.startLiveNavigation = function() {
            if (!state.routeInfo || !state.userLocation) return;
            const origin = `${state.userLocation.lat},${state.userLocation.lng}`;
            const seq = state.routeInfo.sequence;
            const dest = seq[seq.length - 1];
            const destination = `${dest.lat},${dest.lng}`;

            let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;
            if (seq.length > 1) {
                const waypoints = seq.slice(0, -1).map(p => `${p.lat},${p.lng}`).join('|');
                url += `&waypoints=${waypoints}`;
            }
            window.open(url, '_blank');
        };

        // Search Input Handling
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');

        searchInput.addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            clearSearchBtn.classList.toggle('hidden', state.searchQuery.length === 0);
            renderPandalList();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            state.searchQuery = '';
            clearSearchBtn.classList.add('hidden');
            renderPandalList();
            searchInput.focus();
        });

        // Filter Pills
        const filterAll = document.getElementById('filterAll');
        const filterSelected = document.getElementById('filterSelected');

        filterAll.addEventListener('click', () => {
            state.filterMode = 'all';
            filterAll.className = 'px-3 py-1.5 rounded-full font-semibold bg-puja-red text-white flex-shrink-0 active:scale-95 transition-transform';
            filterSelected.className = 'px-3 py-1.5 rounded-full font-semibold bg-gray-100 text-gray-700 flex-shrink-0 active:scale-95 transition-transform';
            renderPandalList();
        });

        filterSelected.addEventListener('click', () => {
            state.filterMode = 'selected';
            filterSelected.className = 'px-3 py-1.5 rounded-full font-semibold bg-puja-red text-white flex-shrink-0 active:scale-95 transition-transform';
            filterAll.className = 'px-3 py-1.5 rounded-full font-semibold bg-gray-100 text-gray-700 flex-shrink-0 active:scale-95 transition-transform';
            renderPandalList();
        });

        document.getElementById('selectAllBtn').addEventListener('click', () => {
            triggerHaptic(15);
            PANDALS.forEach(p => state.selectedPandals.add(p.id));
            updateMarkers();
            renderPandalList();
            updateControlsState();
            showToast("All pandals added to route!");
        });

        // Layer Toggles
        document.getElementById('togglePandals').addEventListener('click', () => {
            triggerHaptic(10);
            state.showPandals = !state.showPandals;
            const btn = document.getElementById('togglePandals');
            btn.classList.toggle('bg-red-50', state.showPandals);
            btn.classList.toggle('text-puja-red', state.showPandals);
            btn.classList.toggle('text-gray-400', !state.showPandals);
            updateMarkers();
        });

        document.getElementById('toggleWashrooms').addEventListener('click', () => {
            triggerHaptic(10);
            state.showWashrooms = !state.showWashrooms;
            const btn = document.getElementById('toggleWashrooms');
            const icon = document.getElementById('washroom-icon');
            const indicator = document.getElementById('washroom-indicator');
            
            icon.classList.toggle('grayscale', !state.showWashrooms);
            icon.classList.toggle('opacity-50', !state.showWashrooms);
            indicator.classList.toggle('hidden', !state.showWashrooms);
            updateMarkers();
            showToast(state.showWashrooms ? "Showing public washrooms" : "Washrooms hidden");
        });

        // Locating Buttons
        document.getElementById('locateUser').addEventListener('click', requestUserLocation);
        document.getElementById('quickLocateBtn').addEventListener('click', requestUserLocation);

        // Planning Buttons
        document.getElementById('planRouteBtn').addEventListener('click', executeRoutePlanning);
        document.getElementById('pillActionBtn').addEventListener('click', () => {
            setSheetState('half');
            executeRoutePlanning();
        });

        // Clear Route Buttons
        document.getElementById('clearRouteBtn').addEventListener('click', clearAllRoutes);
        document.getElementById('floatingClearRoute').addEventListener('click', clearAllRoutes);
        document.getElementById('backToListBtn').addEventListener('click', switchToListVIew);

        // Initialize when window is loaded
        window.addEventListener('load', initAppMap);
    </script>
</body>
</html>
